<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050306" />
    <meta name="description" content="送给余的一朵会呼吸的粒子玫瑰" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌹</text></svg>" />
    <title>余 · 粒子玫瑰</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage" aria-label="送给余的粒子玫瑰">
      <canvas id="rose" aria-hidden="true"></canvas>

      <div class="mist mist--one"></div>
      <div class="mist mist--two"></div>

      <header class="hero">
        <p class="eyebrow">A ROSE IN EVERY UNIVERSE</p>
        <h1>余</h1>
        <p class="subtitle">把藏在星光里的浪漫，送给你</p>
      </header>

      <section class="controls" aria-label="互动控制">
        <button id="bloomButton" type="button">
          <span class="button-glow"></span>
          <span>轻触绽放</span>
        </button>
        <p>拖动花朵旋转 · 轻点屏幕散开</p>
      </section>

      <footer>
        <span></span>
        <p>FOR YU · <span id="year"></span></p>
        <span></span>
      </footer>

      <noscript>请开启 JavaScript，查看这朵送给余的粒子玫瑰。</noscript>
    </main>
    <script src="script.js"></script>
  </body>
</html>
